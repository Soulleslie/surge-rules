name: Tests

# 只跑离线单元测试：不下载上游、不需要 mihomo、不提交任何文件。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run unit tests
        run: python3 -B -m unittest discover -s tests -v
