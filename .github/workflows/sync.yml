name: Sync rules

on:
  schedule:
    - cron: "17 20 * * *" # 每天北京时间 04:17
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 个别规则失败时这一步会标红，但其他规则照常更新、提交
      - name: Sync from MagicRule
        run: python3 scripts/sync.py

      - name: Commit if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add -A China_NoGEOIP.list rules
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Sync rules from MagicRule"
            git push
          fi

      # 公开仓库 60 天没有提交，定时任务会被 GitHub 停用；超过 50 天就提交一次空 commit 保活
      - name: Keepalive
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt $((50 * 86400)) ]; then
            git commit --allow-empty -m "Keepalive"
            git push
          fi
