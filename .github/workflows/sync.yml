name: Sync rules

on:
  schedule:
    - cron: "17 20 * * *" # 每天北京时间 04:17
  workflow_dispatch:
  # 手动改了 custom/ 或转换脚本后，立即重新生成 Clash 规则
  push:
    branches: [main]
    paths:
      - "custom/**"
      - "scripts/clash.py"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 个别规则失败时这一步会标红，但其他规则照常更新、提交
      - name: Sync from MagicRule
        run: python3 scripts/sync.py

      # 以下两步只生成 clash/，不碰 Surge 文件；失败时标红，但 Surge 规则照常提交，clash/ 保留旧版
      - name: Download mihomo
        if: always()
        env:
          MIHOMO_VERSION: v1.19.33
        run: |
          curl -fsSL -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          gunzip mihomo.gz
          chmod +x mihomo
          mv mihomo "$RUNNER_TEMP/mihomo"

      - name: Convert to Clash (mihomo)
        if: always()
        run: python3 scripts/clash.py "$RUNNER_TEMP/mihomo"

      - name: Commit if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add -A rules clash
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Sync rules from MagicRule"
            git push
          fi

      # 公开仓库 60 天没有提交，定时任务会被 GitHub 停用；超过 50 天就提交一次空 commit 保活
      - name: Keepalive
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt $((50 * 86400)) ]; then
            git commit --allow-empty -m "Keepalive"
            git push
          fi
